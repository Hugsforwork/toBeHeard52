<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>星際投票</title>

<style>

/* =========================
   基本
========================= */

body{
    margin:0;
    font-family:"Noto Sans TC",sans-serif;
    background:url("bg-main.png") center/cover no-repeat;
    color:#fff;
}

.container{
    width:min(90%,720px);
    margin:auto;
    padding:36px 20px;
}


/* =========================
   題目
========================= */

.question-title{
    text-align:center;
    margin-bottom:28px;
}

.question-title img{
    width:100%;
    max-width:650px;
    display:block;
    margin:auto;
}


/* =========================
   投票按鈕
========================= */

.buttons{
   display:flex;
    justify-content:center; /* ★ 改為置中，不再強行拆到兩端 */
    gap:12px;
    align-items:flex-end;
    margin-bottom:16px;
    width:100%;
}

.vote-btn{
    width:50%;
    height:95px;

    border:none;
    outline:none;
    background-color:transparent;

    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    cursor:pointer;
    transition:.2s;
}

.vote-btn:hover{
    transform:scale(1.03);
}

.vote-btn:active{
    transform:scale(.97);
}

.vote-btn:focus{
    outline:none;
}

.agree-btn{
    background-image:url("btn-agree.png");
}

.disagree-btn{
    background-image:url("btn-disagree.png");
}


/* =========================
   長條圖
========================= */

.result-wrap{
   margin-top:0;
   width:100%;
}

.dual-bar{
    /* ★ 改成 92% 並 margin:auto 置中，讓長條圖兩端精準縮到按鈕膠囊下方 */
    width:92%;
    margin:0 auto;
    height:28px; 

    border-radius:999px;
    overflow:hidden;

    display:flex;
    position:relative; /* 供百分比絕對定位 */

    background:rgba(255,255,255,.18);
}

.agree-side{
    width:50%;
    background:#FF9996;
    transition:width .6s;
    height:100%;
}

.disagree-side{
    width:50%;
    background:#12AAB0;
    transition:width .6s;
    height:100%;
}

/* ★ 強制浮動在長條圖兩端的百分比文字 */
.percent-text{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:13px;
    font-weight:bold;
    color:#ffffff;
    text-shadow:0px 1px 3px rgba(0, 0, 0, 0.8); /* 強化陰影，確保粉紅背景看得清 */
    pointer-events:none;
    z-index:2;
}

.agree-percent-pos{
    left:12px;
}

.disagree-percent-pos{
    right:12px;
}

/* =========================
   人數
========================= */

.count-row{

    margin-top:14px;

    display:flex;

    justify-content:space-between;

    /* 2. 人數文字變大變清楚 */
    font-size:26px; 
    font-weight:bold;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

.count-row span{
    font-size:26px; /* 讓數字部分比文字更顯眼 */
    margin: 0 4px;
}

</style>

</head>

<body>

<div class="container">

    <!-- 題目 -->

    <div class="question-title">
        <img src="question.png" alt="投票題目">
    </div>


    <!-- 按鈕 -->

    <div class="buttons">

        <button
            id="agree"
            class="vote-btn agree-btn">
        </button>

        <button
            id="disagree"
            class="vote-btn disagree-btn">
        </button>

    </div>


    <!-- 投票結果 -->

    <div class="result-wrap">

        <div class="dual-bar">

            <div
                id="agree-bar"
                class="agree-side">
            </div>

            <div
                id="disagree-bar"
                class="disagree-side">
            </div>

        </div>

        <div class="count-row">

            <div>
                贊成
                <span id="agree-count">0</span>
                人
            </div>

            <div>
                反對
                <span id="disagree-count">0</span>
                人
            </div>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    increment,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDIamIcrV6kLWf75Hyb4_u9Vl3ttLBV8Mk",
  authDomain: "whatdoyouthink-ff4a2.firebaseapp.com",
  projectId: "whatdoyouthink-ff4a2",
  storageBucket: "whatdoyouthink-ff4a2.firebasestorage.app",
  messagingSenderId: "57781999407",
  appId: "1:57781999407:web:ecbd91aac9ff45dd7133da"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const voteRef = doc(db, "votes", "mainVote");


/* =========================
   初始化文件
========================= */

async function initVote(){

    const snap = await getDoc(voteRef);

    if(!snap.exists()){

        await setDoc(voteRef,{
            agree:0,
            disagree:0
        });

    }

}

initVote();


/* =========================
   DOM
========================= */

const agreeBtn = document.getElementById("agree");
const disagreeBtn = document.getElementById("disagree");

const agreeBar = document.getElementById("agree-bar");
const disagreeBar = document.getElementById("disagree-bar");

const agreeCount = document.getElementById("agree-count");
const disagreeCount = document.getElementById("disagree-count");


/* =========================
   投票
========================= */

async function vote(type){

    if(localStorage.getItem("voted")){
        alert("你已經投過票囉！");
        return;
    }

    try{

        await updateDoc(voteRef,{
            [type]:increment(1)
        });

        localStorage.setItem("voted","true");

    }catch(err){

        console.error(err);

        alert("投票失敗");

    }

}

agreeBtn.addEventListener("click",()=>{

    vote("agree");

});

disagreeBtn.addEventListener("click",()=>{

    vote("disagree");

});


/* =========================
   即時同步
========================= */

onSnapshot(voteRef,(docSnap)=>{

    if(!docSnap.exists()) return;

    const data = docSnap.data();

    const agree = data.agree || 0;
    const disagree = data.disagree || 0;

    const total = agree + disagree;

    let agreePercent = 50;
    let disagreePercent = 50;

    if(total>0){

        agreePercent = agree / total * 100;
        disagreePercent = disagree / total * 100;

    }

    agreeBar.style.width = agreePercent + "%";
    disagreeBar.style.width = disagreePercent + "%";

    agreeCount.textContent = agree;
    disagreeCount.textContent = disagree;

});
</script>
   
</body>
</html>
